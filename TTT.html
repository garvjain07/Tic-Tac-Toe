<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f1ff">
    <meta name="description" content="Play a fast, modern Tic Tac Toe game against a friend or a smart computer opponent.">
    <meta name="keywords" content="tic tac toe, tictactoe, online game, tic tac toe AI, board game">
    <meta name="author" content="Tic Tac Toe">
    <meta property="og:title" content="Tic Tac Toe - Play with a Friend or AI">
    <meta property="og:description" content="A polished Tic Tac Toe game with online-style AI, score tracking and themes.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./logo.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="./logo.svg">
    <title>Tic Tac Toe - Play Online with AI</title>
    <link rel="canonical" href="./">
    <link rel="icon" type="image/svg+xml" href="./logo.svg">
    <link rel="apple-touch-icon" href="./logo.svg">
    <link rel="stylesheet" href="style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Tic Tac Toe",
      "applicationCategory": "Game",
      "operatingSystem": "Any",
      "playMode": "MultiPlayer",
      "description": "A modern Tic Tac Toe board game for two players or against a computer."
    }
    </script>
</head>
<body>
    <main class="app-shell">
        <section class="game-card" aria-labelledby="game-title">
            <header class="topbar">
                <div class="brand">
                    <img class="brand-mark" src="./logo.svg" alt="" width="34" height="34">
                    <h1 id="game-title">Tic Tac Toe</h1>
                </div>
                <button id="theme-btn" class="icon-button" type="button" aria-label="Switch theme" title="Switch theme">
                    <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
                </button>
            </header>

            <div class="mode-row" aria-label="Game mode">
                <div class="segmented" id="mode-switch">
                    <button class="mode-button active" type="button" data-mode="bot" aria-pressed="true">vs AI</button>
                    <button class="mode-button" type="button" data-mode="human" aria-pressed="false">2 Players</button>
                </div>
                <label id="difficulty-wrap" class="difficulty">
                    <span>Level</span>
                    <select id="difficulty" aria-label="AI difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </label>
            </div>

            <div class="scoreboard" aria-label="Scoreboard">
                <div class="score score-x active" id="score-x-card">
                    <span class="score-label">You <b>X</b></span>
                    <strong id="score-x">0</strong>
                </div>
                <div class="score score-draw">
                    <span class="score-label">Draw</span>
                    <strong id="score-draw">0</strong>
                </div>
                <div class="score score-o" id="score-o-card">
                    <span class="score-label" id="o-label">AI <b>O</b></span>
                    <strong id="score-o">0</strong>
                </div>
            </div>

            <div class="status" id="status" role="status" aria-live="polite">
                <span class="status-dot"></span>
                <span id="status-text">Your turn</span>
            </div>

            <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board">
                <button class="cell" type="button" role="gridcell" aria-label="Top left" data-index="0"></button>
                <button class="cell" type="button" role="gridcell" aria-label="Top center" data-index="1"></button>
                <button class="cell" type="button" role="gridcell" aria-label="Top right" data-index="2"></button>
                <button class="cell" type="button" role="gridcell" aria-label="Middle left" data-index="3"></button>
                <button class="cell" type="button" role="gridcell" aria-label="Center" data-index="4"></button>
                <button class="cell" type="button" role="gridcell" aria-label="Middle right" data-index="5"></button>
                <button class="cell" type="button" role="gridcell" aria-label="Bottom left" data-index="6"></button>
                <button class="cell" type="button" role="gridcell" aria-label="Bottom center" data-index="7"></button>
                <button class="cell" type="button" role="gridcell" aria-label="Bottom right" data-index="8"></button>
            </div>

            <div class="actions">
                <button id="reset-btn" class="primary-button" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 11V5m0 6h-6"/></svg>
                    New round
                </button>
                <button id="score-reset-btn" class="secondary-button" type="button">Reset scores</button>
            </div>
        </section>
    </main>
    <div id="celebration" aria-hidden="true"></div>
    <script src="script.js" defer></script>
</body>
</html>
